<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>TacticalTooling — 11th Edition 40K Tactics Board</title>
<link rel="stylesheet" href="css/app.css?v=2026.11.20-4">
</head>
<body>
<header id="topbar">
  <div class="brand">Tactical<b>Tooling</b> <span class="ed">11th</span></div>
  <div class="tools" role="toolbar">
    <button data-tool="select" class="on" title="Select / move (V)">✥ Move</button>
    <button data-tool="measure" title="Measure (M)">📏 Measure</button>
    <span class="sep"></span>
    <button id="btnModelMode" title="Drag single models instead of whole units (G)">Unit drag</button>
    <span class="sep"></span>
    <button id="btnZoomOut" title="Zoom out (-)">−</button>
    <button id="btnFit" title="Fit board (0)">Fit</button>
    <button id="btnZoomIn" title="Zoom in (+)">+</button>
    <span class="sep"></span>
    <button id="btnUndo" title="Undo (Ctrl+Z)">↶</button>
    <button id="btnRedo" title="Redo (Ctrl+Y)">↷</button>
    <span class="sep"></span>
    <button id="btnPanel" class="mobile-only" title="Show panel">☰</button>
  </div>
</header>

<main id="main">
  <div id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="hatchA" width="0.6" height="0.6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="0.6" height="0.6" fill="var(--pa)" fill-opacity="0.35"/><rect width="0.22" height="0.6" fill="var(--pa)"/>
        </pattern>
        <pattern id="hatchB" width="0.6" height="0.6" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
          <rect width="0.6" height="0.6" fill="var(--pb)" fill-opacity="0.35"/><rect width="0.22" height="0.6" fill="var(--pb)"/>
        </pattern>
        <pattern id="terrainTex" width="1" height="1" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
          <rect width="1" height="1" fill="#5b5446"/><rect width="0.08" height="1" fill="#6c6453"/>
        </pattern>
        <clipPath id="rangeClip"></clipPath>
      </defs>
      <g id="world"></g>
    </svg>
    <div id="hud"></div>
    <div id="legend"></div>
    <div id="toast"></div>
  </div>

  <aside id="panel">
    <nav class="tabs">
      <button data-tab="sel" class="on">Selected</button>
      <button data-tab="armies">Armies</button>
      <button data-tab="layout">Layout</button>
      <button data-tab="view">View</button>
      <button data-tab="file">File</button>
    </nav>
    <section id="tab-sel" class="tab on"></section>
    <section id="tab-armies" class="tab"></section>
    <section id="tab-layout" class="tab"></section>
    <section id="tab-view" class="tab"></section>
    <section id="tab-file" class="tab"></section>
  </aside>
</main>

<input type="file" id="fileInput" hidden>

<script src="js/data.js?v=2026.11.20-4"></script>
<script src="js/geometry.js?v=2026.11.20-4"></script>
<script src="js/layouts-official.js?v=2026.11.20-4"></script>
<script src="js/bases-guide.js?v=2026.11.20-4"></script>
<script src="js/importers.js?v=2026.11.20-4"></script>
<script src="js/app.js?v=2026.11.20-4"></script>
</body>
</html>
